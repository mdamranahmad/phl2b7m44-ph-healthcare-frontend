<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background grid to simulate transparency -->
    <pattern id="checkerboard" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#e5e7eb" />
      <rect x="10" width="10" height="10" fill="#f3f4f6" />
      <rect y="10" width="10" height="10" fill="#f3f4f6" />
      <rect x="10" y="10" width="10" height="10" fill="#e5e7eb" />
    </pattern>

    <!-- Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Optional subtle transparent grid background -->
  <rect width="100%" height="100%" fill="url(#checkerboard)" />

  <g transform="translate(0, 0)">
    <!-- Outer Shield / Circle Elements -->
    <g filter="url(#dropShadow)">
      <!-- Outer protective ring -->
      <path d="M 250 55 A 145 145 0 1 1 130 95" fill="none" stroke="url(#shieldGrad)" stroke-width="10" stroke-linecap="round" />

      <!-- Shield Background Silhouette -->
      <path d="M 250 85 L 340 120 C 340 220 290 310 250 340 C 210 310 160 220 160 120 Z" fill="#ffffff" opacity="0.9" />

      <!-- Shield Border -->
      <path d="M 250 75 L 350 115 C 350 225 300 320 250 355 C 200 320 150 225 150 115 Z" fill="none" stroke="url(#shieldGrad)" stroke-width="8" stroke-linejoin="round" />
    </g>

    <!-- Caduceus / Medical Cross Centerpiece -->
    <g fill="url(#accentGrad)">
      <!-- Central Staff -->
      <rect x="244" y="130" width="12" height="190" rx="6" />
      <!-- Staff Top Globe -->
      <circle cx="250" cy="125" r="9" />

      <!-- Wings -->
      <path d="M 250 145 C 220 130 180 140 170 155 C 185 170 210 165 240 175 Z" />
      <path d="M 250 145 C 280 130 320 140 330 155 C 315 170 290 165 260 175 Z" />

      <!-- Stylized 'PH' Monogram Integration Behind Rod -->
      <!-- 'P' Loop -->
      <path d="M 210 175 L 210 250 L 235 250 C 255 250 265 240 265 225 C 265 210 255 200 235 200 L 230 200 L 230 175 Z" fill="#1e40af" opacity="0.85" />
      <!-- 'H' Uprights / Crossbar integrated subtly -->
    </g>

    <!-- Snakes / Medical Asclepius Curves -->
    <path d="M 250 170 C 230 190 270 210 250 230 C 230 250 270 270 250 290" fill="none" stroke="#0ea5e9" stroke-width="5" stroke-linecap="round" />
    <path d="M 250 170 C 270 190 230 210 250 230 C 270 250 230 270 250 290" fill="none" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round" opacity="0.7" />

    <!-- Typography Section -->
    <g text-anchor="middle">
      <text x="250" y="415" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="30" fill="#0f172a" letter-spacing="3">PH HEALTHCARE</text>
      <text x="250" y="445" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="14" fill="#475569" letter-spacing="1.5">Your Trusted Health Partner</text>
    </g>
  </g>
</svg>
